<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전자문서산업계 애로사항·민원 통합관리 시스템</title>
<style>
  :root{
    --bg:#efe9dd; --panel:#efe9dd; --card:#ffffff;
    --ink:#2a2620; --sub:#8a8375; --sub2:#a39c8c;
    --line:#e7e0d0; --line-soft:#f1ebdd;
    --accent:#3b6fe0; --accent-soft:#e7edfb;
    --danger:#b23b3b; --danger-soft:#fbe4e1;
    --warn:#b87a2e; --warn-soft:#f6e6cb;
    --ok:#2f8f5b; --ok-soft:#e3f5ea;
    --ink-soft:#57503f;
    --r-lg:18px; --r-md:12px; --r-sm:8px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  a{color:inherit}
  .shell{max-width:1400px;margin:0 auto;padding:20px;display:flex;gap:20px;align-items:flex-start;min-height:100vh}
  /* sidebar */
  .sidebar{width:212px;flex:none;background:var(--panel);border-radius:var(--r-lg);padding:18px 12px;position:sticky;top:20px}
  .brand{font-size:15px;font-weight:700;padding:6px 10px 16px;color:var(--ink)}
  .nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .nav li{border-radius:10px}
  .nav button{
    width:100%;text-align:left;background:transparent;border:none;padding:10px 12px;border-radius:10px;
    font-size:14px;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:500;
  }
  .nav button .ic{width:16px;text-align:center;opacity:.85}
  .nav button:hover{background:#e4ddcd}
  .nav li.active button{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .nav .sep{height:1px;background:var(--line);margin:10px 4px}

  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
  .topbar{background:var(--card);border-radius:var(--r-lg);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .topbar h1{font-size:19px;margin:0;font-weight:700}
  .topbar .right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--sub)}
  .bell{position:relative;cursor:pointer;font-size:16px;padding:6px;border-radius:8px}
  .bell:hover{background:var(--line-soft)}
  .bell .dot{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:10px;line-height:1;border-radius:10px;padding:2px 5px;font-weight:700}
  .userpick{position:relative}
  .userpick select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink);cursor:pointer}

  .content{background:transparent;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border-radius:var(--r-lg);padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card h2{font-size:16px;margin:0 0 14px;font-weight:700}
  .card h2 small{font-weight:500;color:var(--sub);font-size:12px;margin-left:6px}
  .grid{display:grid;gap:14px}
  .grid.cols-4{grid-template-columns:repeat(4,1fr)}
  .grid.cols-2{grid-template-columns:1fr 1fr}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .grid.cols-5{grid-template-columns:repeat(5,1fr)}
  @media (max-width:1050px){.grid.cols-4,.grid.cols-5{grid-template-columns:repeat(2,1fr)}.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}}

  .kpi{background:var(--card);border-radius:14px;padding:16px 18px}
  .kpi .lbl{font-size:12px;color:var(--sub);margin-bottom:6px}
  .kpi .val{font-size:26px;font-weight:700}
  .kpi .val small{font-size:13px;color:var(--sub);font-weight:500}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .badge.danger{background:var(--danger-soft);color:var(--danger)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.info{background:var(--accent-soft);color:var(--accent)}
  .badge.gray{background:var(--line-soft);color:var(--sub)}

  .toprow{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;color:var(--sub);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line-soft)}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--line-soft)}
  tbody tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right}

  .btn{border:none;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--line-soft);color:var(--ink)}
  .btn.primary{background:#26221c;color:#fff}
  .btn.accent{background:var(--accent);color:#fff}
  .btn.danger{background:var(--danger);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}

  input[type=text],input[type=date],input[type=search],input[type=email],input[type=tel],input[type=number],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:70px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  .field{margin-bottom:13px}
  .req::after{content:" *";color:var(--danger)}
  .hint{font-size:11.5px;color:var(--sub);margin-top:4px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  .searchbar{display:flex;gap:8px;margin-bottom:10px}
  .searchbar input{flex:1}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters select,.filters input{width:auto;min-width:120px}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 16px;flex-wrap:wrap}
  .tabs button{background:transparent;border:none;padding:9px 4px;margin-right:18px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.active{color:var(--ink);border-bottom-color:var(--ink)}

  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{position:relative;padding:0 0 20px 22px;border-left:2px solid var(--line-soft)}
  .timeline li:last-child{border-color:transparent}
  .timeline li::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .timeline li.pending::before{background:#fff;border:2px solid var(--sub2)}
  .timeline li .t{font-weight:700;font-size:13.5px}
  .timeline li .d{color:var(--sub);font-size:12.5px;margin-top:2px}
  .timeline li .who{color:var(--sub);font-size:12px}

  .pillbox{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pill{background:var(--line-soft);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-soft);font-weight:600}

  .modal-backdrop{position:fixed;inset:0;background:rgba(30,26,18,.42);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100}
  .modal-backdrop.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal.wide{max-width:840px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .modal-head h3{margin:0;font-size:17px}
  .modal-head .x{cursor:pointer;font-size:20px;color:var(--sub);background:none;border:none}

  .empty{color:var(--sub);font-size:13px;padding:18px 4px;text-align:center}
  .muted{color:var(--sub)}
  .link{color:var(--accent);cursor:pointer;font-weight:600}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#26221c;color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;z-index:200}
  .toast.show{opacity:1;bottom:34px}

  .stepbar{display:flex;gap:14px;font-size:12.5px;color:var(--sub);margin-bottom:16px;font-weight:600}
  .stepbar b{color:var(--ink)}
  .stepblock{border-top:1px solid var(--line-soft);padding:16px 0}
  .stepblock:first-of-type{border-top:none;padding-top:0}
  .stepblock h4{margin:0 0 12px;font-size:14px}

  .kv{display:grid;grid-template-columns:110px 1fr;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--sub)}

  .company-list{display:grid;grid-template-columns:1fr;gap:0}
  .split2{display:grid;grid-template-columns:340px 1fr;gap:16px}
  @media (max-width:900px){.split2{grid-template-columns:1fr}}

  .barlist .brow{margin-bottom:12px}
  .barlist .blab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--ink-soft);font-weight:600}
  .btrack{background:#e9e2d1;border-radius:999px;height:9px;overflow:hidden}
  .bfill{background:var(--accent);height:100%;border-radius:999px}

  .donutwrap{display:flex;align-items:center;gap:22px}
  .donut{width:120px;height:120px;border-radius:50%;flex:none}
  .legend{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:7px}
  .legend li{display:flex;align-items:center;gap:8px}
  .legend .sw{width:9px;height:9px;border-radius:2px;flex:none}

  .linechart{width:100%;height:170px}

  .noteitem{padding:11px 4px;border-bottom:1px solid var(--line-soft);font-size:13px;cursor:pointer}
  .noteitem:last-child{border-bottom:none}
  .noteitem .nt{font-weight:700}
  .noteitem .nd{color:var(--sub);font-size:12px;margin-top:2px}

  .checkbox-row{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px}
  .filechip{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--line-soft);border-radius:9px;margin-bottom:8px;font-size:12.8px}

  footer.foot{text-align:center;color:var(--sub2);font-size:11.5px;padding:6px 0 18px}
  @media print{ .sidebar,.topbar,.btnrow,.tabs,.searchbar,.filters,.modal-backdrop,.bell,.userpick{display:none !important} .shell{padding:0} .card{box-shadow:none} }
</style>
</head>
<body>

<div class="shell">
  <nav class="sidebar">
    <div class="brand">전자문서산업협회</div>
    <ul class="nav" id="nav-list"></ul>
  </nav>

  <main class="main">
    <div class="topbar">
      <h1 id="page-title">대시보드</h1>
      <div class="right">
        <div class="bell" id="bell-btn" onclick="toggleNotifPanel()">
          🔔<span class="dot" id="notif-count" style="display:none">0</span>
        </div>
        <div class="userpick">
          <select id="user-select" onchange="setCurrentUser(this.value)"></select>
        </div>
      </div>
    </div>

    <div class="content" id="app-main"></div>
    <footer class="foot">전자문서산업계 애로사항·민원 통합관리 시스템 · 데모(로컬 브라우저 저장) · 실제 문서번호·연락처는 더미 데이터입니다</footer>
  </main>
</div>

<div class="modal-backdrop" id="notif-panel-backdrop" onclick="if(event.target===this) closeNotifPanel()">
  <div class="modal" style="max-width:420px;margin-top:70px" onclick="event.stopPropagation()">
    <div class="modal-head"><h3>알림</h3><button class="x" onclick="closeNotifPanel()">&times;</button></div>
    <div id="notif-panel-body"></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="x" onclick="closeModal()">&times;</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 공통 유틸 ===================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){ if(!iso) return "-"; return iso; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function diffDays(fromISO,toISO){ const a=new Date(fromISO+"T00:00:00"), b=new Date(toISO+"T00:00:00"); return Math.round((b-a)/86400000); }
function monthLabel(iso){ return iso.slice(0,7); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(window.__toastT); window.__toastT=setTimeout(()=>t.classList.remove("show"),2200); }
function uid(prefix){ DB.seq[prefix]=(DB.seq[prefix]||0)+1; return prefix+"_"+DB.seq[prefix]; }

const STATUS_LIST = ["신규접수","검토중","내부협의","관계기관 협의중","정책건의중","답변대기","회원사 회신대기","처리완료","종결","보류","이관"];
const IMPORTANCE_LIST = ["긴급","높음","보통","낮음"];
const DEFAULT_CHANNELS = ["전화","이메일","홈페이지","온라인 민원","간담회","협회 행사","정부/공공기관 요청","회원사 방문","임원/경영진 전달","기타"];
const DEFAULT_TYPES = {
  "법·제도":["법령 개정 요구","법령 해석","제도 개선","행정절차 개선"],
  "규제":["규제 신설","규제 완화","규제 해석","규제 애로"],
  "행정":["행정처리 지연","서류 요구 과다","절차 안내 미흡"],
  "기술":["기술 표준 문의","인증 절차 문의","시스템 연계"],
  "사업":["정부사업","공공사업","사업 참여","지원사업"],
  "계약/조달":["입찰 참가 자격","계약 조건"],
  "세제":["세제 지원 문의","세무 처리"],
  "인증":["인증 취득 절차","인증 갱신"],
  "보안":["보안 인증 요구","개인정보 처리"],
  "표준":["표준 제정 요청","표준 해석"],
  "시장/산업":["시장 진입 애로","산업 통계 요청"],
  "기타":["기타 문의"]
};
const CLOSE_REASONS = ["요구사항 수용","제도개선","관계기관 답변 완료","회원사 안내 완료","단순 문의","타 기관 이관","회원사 요청 철회","기타"];
const POLICY_STATUS = ["발굴","내부검토","건의안 작성","기관 제출","기관 검토","답변완료","반영","일부반영","미반영","지속추진","종결"];
const DEPTS = ["산업정책팀","정책기획팀","회원지원팀"];

/* ===================== 시드 데이터 ===================== */
function buildSeed(){
  const companies=[
    {id:"co_1",name:"A기업",bizNo:"111-11-11111",manager:"박정호",phone:"02-111-1111",email:"contact@a-corp.co.kr",joinedAt:"2020-03-02"},
    {id:"co_2",name:"B기업",bizNo:"222-22-22222",manager:"오세영",phone:"02-222-2222",email:"contact@b-corp.co.kr",joinedAt:"2019-11-15"},
    {id:"co_3",name:"C기업",bizNo:"333-33-33333",manager:"윤가람",phone:"02-333-3333",email:"contact@c-corp.co.kr",joinedAt:"2021-05-20"},
    {id:"co_4",name:"D기업",bizNo:"444-44-44444",manager:"신동혁",phone:"02-444-4444",email:"contact@d-corp.co.kr",joinedAt:"2018-07-09"},
    {id:"co_5",name:"E기업",bizNo:"555-55-55555",manager:"장미래",phone:"02-555-5555",email:"contact@e-corp.co.kr",joinedAt:"2022-02-11"},
  ];
  const agencies=[

    {id:"ag_3",name:"□□원",dept:"표준정책실",manager:"최연구위원",position:"연구위원",phone:"044-000-3333",email:"agency3@go.kr",duties:"전자문서 인증·표준 소관"},

  const users=[
    {id:"u_1",name:"홍길동",dept:"산업정책팀",role:"담당자"},

    {id:"u_7",name:"김태영",dept:"산업정책팀",role:"팀장"},
  ];

  function C(no,receivedAt,channel,companyId,companyManager,title,content,type,subtype,importance,dept,assignee,deadline,status,extra){
    return Object.assign({
      id:"cp_"+no, no:"EDPA-2026-"+String(no).padStart(4,"0"),
      receivedAt, channel, companyId, companyManager,
      title, content, type, subtype, field:type, importance,
      dept, assignee, deadline, status,
      completedAt:null, relatedLaw:"", relatedAgencyIds:[], closeReason:"",
      nextAction:"", nextActionDate:"", similarComplaintIds:[]
    }, extra||{});
  }

  const complaints=[

const STORE_KEY="edpa_complaint_system_v1";
let DB, UI;
function loadDB(){
  const raw=localStorage.getItem(STORE_KEY);
  if(raw){
    try{
      const db=JSON.parse(raw);
      if(!db.codes) db.codes={ types: JSON.parse(JSON.stringify(DEFAULT_TYPES)), channels: DEFAULT_CHANNELS.slice() };
      if(!db.seq) db.seq={};
      if(db.seq.ty==null) db.seq.ty=0;
      if(db.seq.ch==null) db.seq.ch=0;
      return db;
    }catch(e){}
  }
  return buildSeed();
}
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }

/* =====================================================================
   BACKEND — 데이터 저장·조회·업무규칙(검증·권한·감사로그) 계층
   화면(FRONTEND, 아래쪽 render/view/tab/open*Form/submit* 함수들)은
   데이터를 직접 건드리지 않고 이 Backend.* 메서드만 호출한다.
   모든 메서드는 {ok:true, data, message} 또는 {ok:false, message} 형태로 응답한다
   (실제 서버 API를 로컬 함수 호출로 흉내낸 것 — 네트워크는 없음).
   ===================================================================== */
const Backend = (function(){
  function fail(message){ return {ok:false, message}; }
  function ok(data, message){ return {ok:true, data, message}; }
  function entityOf(id){
    if(!id) return "기타";
    if(id==="codes") return "분류체계";
    if(id.startsWith("cp_")) return "민원";
    if(id.startsWith("co_")) return "회원사";
    if(id.startsWith("ag_")) return "관계기관";
    if(id.startsWith("po_")) return "정책건의";
    if(id.startsWith("us_")||id.startsWith("u_")) return "사용자";
    return "기타";
  }
  function targetLabel(id){
    const c=complaintById(id); if(c) return `${c.no} ${c.title}`;
    const co=companyById(id); if(co) return co.name;
    const ag=agencyById(id); if(ag) return ag.name;
    const p=policyById(id); if(p) return p.title;
    const u=DB.users.find(x=>x.id===id); if(u) return u.name;
    return id;
  }
  function audit(target,field,before,after,reason){
    DB.auditLog.push({id:uid("au"),at:new Date().toISOString().slice(0,16).replace("T"," "),user:currentUser().name,
      entity:entityOf(target),target,field,before:before||"",after:after||"",reason:reason||""});
  }
  function history(complaintId,category,content,extra){
    DB.history.push(Object.assign({id:uid("hi"),complaintId,at:new Date().toISOString().slice(0,16).replace("T"," "),
      by:currentUser().name,category,content,agency:"",counterpart:"",answer:"",nextAction:"",nextActionDate:""},extra||{}));
  }

  return {
    entityOf, targetLabel,

    /* ---------- 민원 ---------- */
    createComplaint(d){
      if(isReadOnlyRole()) return fail("조회 전용 계정은 민원을 등록할 수 없습니다");
      if(!d.companyId) return fail("회원사를 선택해 주세요");
      if(!d.title) return fail("민원 제목을 입력해 주세요");
      if(!d.deadline) return fail("처리기한을 입력해 주세요");
      const company=companyById(d.companyId);
      if(!company) return fail("회원사 정보를 찾을 수 없습니다");
      const year=new Date(d.receivedAt).getFullYear();
      DB.seq.receiptNo=(DB.seq.receiptNo||0)+1;
      const no=`EDPA-${year}-${String(DB.seq.receiptNo).padStart(4,"0")}`;
      const id="cp_"+DB.seq.receiptNo+"_"+Date.now();
      const c={ id, no, receivedAt:d.receivedAt, channel:d.channel, companyId:d.companyId, companyManager:d.companyManager||company.manager,
        title:d.title, content:d.content, type:d.type, subtype:d.subtype, field:d.type, importance:d.importance,
        dept:d.dept, assignee:d.assignee, deadline:d.deadline, status:"신규접수", completedAt:null, relatedLaw:d.relatedLaw,
        relatedAgencyIds:[], closeReason:"", nextAction:"", nextActionDate:"",
        similarComplaintIds: findSimilarComplaints(d.title+" "+d.content).map(x=>x.id) };
      DB.complaints.push(c);
      DB.attachments = DB.attachments||[];
      (d.attachments||[]).forEach(fn=>{
        DB.attachments.push({id:uid("att"),complaintId:c.id,name:fn,type:"기타",uploadedBy:currentUser().name,uploadedAt:todayISO()});
        audit(c.id,"첨부파일","","등록: "+fn);
      });
      history(c.id,"접수",`민원 접수 (회원사 ${company.name}, 접수경로: ${d.channel})`);
      if(d.assignee) history(c.id,"배정",`담당자 ${d.assignee} 배정`);
      audit(c.id,"등록","",`신규 민원 등록 (${no})`);
      persist();
      return ok(c, `민원이 등록되었습니다 (${no})`);
    },

    addHistory(complaintId, d){
      const c=complaintById(complaintId); if(!c) return fail("민원을 찾을 수 없습니다");
      if(!canEditComplaint(c)) return fail("담당 건이 아니어서 처리이력을 등록할 수 없습니다");
      if(!d.content) return fail("처리내용을 입력해 주세요");
      history(complaintId, d.category, d.content, {nextAction:d.nextAction, nextActionDate:d.nextActionDate});
      c.nextAction=d.nextAction; c.nextActionDate=d.nextActionDate;
      if(d.status && d.status!==c.status){ const before=c.status; c.status=d.status; audit(complaintId,"상태",before,d.status); }
      audit(complaintId,"처리이력","",d.category+": "+d.content);
      persist();
      return ok(c, "처리이력이 등록되었습니다");
    },

    setStatus(complaintId, status){
      const c=complaintById(complaintId); if(!c) return fail("민원을 찾을 수 없습니다");
      if(!canEditComplaint(c)) return fail("담당 건이 아니어서 상태를 변경할 수 없습니다");
      const before=c.status; c.status=status;
      if(status==="처리완료") c.completedAt=todayISO();
      history(complaintId,"상태변경",`상태 변경: ${before} → ${status}`);
      audit(complaintId,"상태",before,status);
      persist();
      return ok(c, "상태가 변경되었습니다");
    },

    addConsultation(complaintId, d){
      const c=complaintById(complaintId); if(!c) return fail("민원을 찾을 수 없습니다");
      if(!canEditComplaint(c)) return fail("담당 건이 아니어서 기관협의를 등록할 수 없습니다");
      if(!d.content) return fail("협의내용을 입력해 주세요");
      const cs={id:uid("cs"),complaintId,agencyId:d.agencyId,date:d.date,method:d.method,content:d.content,answer:d.answer,followup:d.followup,replyDeadline:d.replyDeadline};
      DB.consultations.push(cs);
      if(!c.relatedAgencyIds.includes(d.agencyId)) c.relatedAgencyIds.push(d.agencyId);
      if(c.status!=="관계기관 협의중" && c.status!=="답변대기"){ const before=c.status; c.status = d.answer? "답변대기" : "관계기관 협의중"; audit(complaintId,"상태",before,c.status); }
      history(complaintId, "관계기관 협의", d.content, {agency:agencyName(d.agencyId), answer:d.answer, nextAction:d.followup, nextActionDate:d.replyDeadline});
      c.nextAction=d.followup; c.nextActionDate=d.replyDeadline;
      audit(complaintId,"기관협의","","등록: "+agencyName(d.agencyId));
      persist();
      return ok(cs, "기관협의 이력이 등록되었습니다");
    },

    linkPolicy(complaintId, policyId){
      const c=complaintById(complaintId); if(!c) return fail("민원을 찾을 수 없습니다");
      if(!canEditComplaint(c)) return fail("담당 건이 아니어서 정책건의를 연결할 수 없습니다");
      const p=policyById(policyId); if(!p) return fail("정책건의를 선택해 주세요");
      if(!p.linkedComplaintIds.includes(complaintId)) p.linkedComplaintIds.push(complaintId);
      const before=c.status; c.status="정책건의중";
      history(complaintId,"정책건의 연결",`정책건의 '${p.title}'에 연결`);
      audit(complaintId,"정책건의","",p.title);
      if(before!==c.status) audit(complaintId,"상태",before,c.status);
      persist();
      return ok(p, "정책건의에 연결되었습니다");
    },

    reassign(complaintId, d){
      const c=complaintById(complaintId); if(!c) return fail("민원을 찾을 수 없습니다");
      if(!canEditComplaint(c)) return fail("담당 건이 아니어서 담당자·중요도를 변경할 수 없습니다");
      if(d.assignee!==c.assignee){
        audit(complaintId,"담당자",c.assignee||"미배정",d.assignee||"미배정",d.reason);
        history(complaintId,"담당자 변경",`담당자 변경: ${c.assignee||'미배정'} → ${d.assignee||'미배정'}`);
        c.assignee=d.assignee;
      }
      if(d.importance!==c.importance){
        audit(complaintId,"중요도",c.importance,d.importance,d.reason);
        history(complaintId,"중요도 변경",`중요도 변경: ${c.importance} → ${d.importance}`);
        c.importance=d.importance;
      }
      persist();
      return ok(c, "변경되었습니다");
    },

    closeComplaint(complaintId, d){
      const c=complaintById(complaintId); if(!c) return fail("민원을 찾을 수 없습니다");
      if(!canEditComplaint(c)) return fail("담당 건이 아니어서 종결할 수 없습니다");
      if(!d.reason) return fail("종결사유를 선택해 주세요");
      const before=c.status;
      c.status="종결"; c.closeReason=d.reason; if(!c.completedAt) c.completedAt=todayISO();
      history(complaintId,"종결",`종결 처리 (사유: ${d.reason})${d.note? ' — '+d.note:''}`);
      audit(complaintId,"상태",before,"종결",d.reason);
      persist();
      return ok(c, "민원이 종결 처리되었습니다");
    },

    addAttachments(complaintId, files){
      const c=complaintById(complaintId); if(!c) return fail("민원을 찾을 수 없습니다");
      if(!canEditComplaint(c)) return fail("담당 건이 아니어서 파일을 첨부할 수 없습니다");
      DB.attachments=DB.attachments||[];
      files.forEach(f=>{
        DB.attachments.push({id:uid("att"),complaintId,name:f,type:"기타",uploadedBy:currentUser().name,uploadedAt:todayISO()});
        audit(complaintId,"첨부파일","","등록: "+f);
      });
      persist();
      return ok(null, "파일이 첨부되었습니다");
    },
    removeAttachment(attId){
      const a=(DB.attachments||[]).find(x=>x.id===attId); if(!a) return fail("파일을 찾을 수 없습니다");
      const c=complaintById(a.complaintId);
      if(c && !canEditComplaint(c)) return fail("담당 건이 아니어서 파일을 삭제할 수 없습니다");
      DB.attachments = DB.attachments.filter(x=>x.id!==attId);
      audit(a.complaintId,"첨부파일",a.name,"삭제");
      persist();
      return ok(null, "파일이 삭제되었습니다");
    },

    /* ---------- 정책건의 ---------- */
    savePolicy(existingId, d){
      if(isReadOnlyRole()) return fail("조회 전용 계정은 정책건의를 등록할 수 없습니다");
      if(!d.title) return fail("정책건의 제목을 입력해 주세요");
      if(existingId){
        const p=policyById(existingId); if(!p) return fail("정책건의를 찾을 수 없습니다");
        const beforeStatus=p.status;
        Object.assign(p, d, {proposedAt:p.proposedAt});
        audit(existingId,"정책건의","",d.title);
        if(beforeStatus!==p.status) audit(existingId,"정책건의 상태",beforeStatus,p.status);
        persist();
        return ok(p, "정책건의가 저장되었습니다");
      }
      const p=Object.assign({id:uid("po"), proposedAt:todayISO()}, d);
      DB.policies.push(p);
      (d.linkedComplaintIds||[]).forEach(cid=>{
        history(cid,"정책건의 연결",`신규 정책건의 '${d.title}'에 연결`);
        audit(cid,"정책건의","",d.title);
      });
      audit(p.id,"등록","",`신규 정책건의 등록 (${d.title})`);
      persist();
      return ok(p, "정책건의가 저장되었습니다");
    },

    /* ---------- 회원사·관계기관 ---------- */
    saveCompany(existingId, d){
      if(isReadOnlyRole()) return fail("조회 전용 계정은 회원사를 등록·수정할 수 없습니다");
      if(!d.name) return fail("회원사명을 입력해 주세요");
      if(existingId){
        const co=companyById(existingId); if(!co) return fail("회원사를 찾을 수 없습니다");
        Object.assign(co, d); audit(existingId,"회원사","",`정보 수정: ${d.name}`);
        persist(); return ok(co, "회원사 정보가 수정되었습니다");
      }
      const co=Object.assign({id:uid("co")}, d); DB.companies.push(co);
      audit(co.id,"등록","",`신규 회원사 등록 (${d.name})`);
      persist(); return ok(co, "회원사가 추가되었습니다");
    },
    saveAgency(existingId, d){
      if(isReadOnlyRole()) return fail("조회 전용 계정은 기관을 등록·수정할 수 없습니다");
      if(!d.name) return fail("기관명을 입력해 주세요");
      if(existingId){
        const a=agencyById(existingId); if(!a) return fail("기관을 찾을 수 없습니다");
        Object.assign(a, d); audit(existingId,"관계기관","",`정보 수정: ${d.name}`);
        persist(); return ok(a, "기관 정보가 수정되었습니다");
      }
      const a=Object.assign({id:uid("ag")}, d); DB.agencies.push(a);
      audit(a.id,"등록","",`신규 기관 등록 (${d.name})`);
      persist(); return ok(a, "기관이 추가되었습니다");
    },

    /* ---------- 사용자 ---------- */
    saveUser(existingId, d){
      if(!isAdmin()) return fail("사용자 관리는 관리자만 가능합니다");
      if(!d.name) return fail("이름을 입력해 주세요");
      if(existingId){
        const u=DB.users.find(x=>x.id===existingId); if(!u) return fail("사용자를 찾을 수 없습니다");
        const beforeRole=u.role;
        Object.assign(u, d);
        audit(existingId,"사용자","",`정보 수정: ${d.name}(${d.role})`);
        if(beforeRole!==d.role) audit(existingId,"권한",beforeRole,d.role);
        persist(); return ok(u, "사용자 정보가 수정되었습니다");
      }
      const u=Object.assign({id:uid("us")}, d); DB.users.push(u);
      audit(u.id,"등록","",`신규 사용자 등록 (${d.name}, ${d.role})`);
      persist(); return ok(u, "사용자가 추가되었습니다");
    },
    deleteUser(id){
      if(!isAdmin()) return fail("사용자 관리는 관리자만 가능합니다");
      if(DB.users.length<=1) return fail("최소 1명의 사용자가 필요합니다");
      if(id===UI.currentUserId) return fail("현재 로그인한 사용자는 삭제할 수 없습니다");
      const u=DB.users.find(x=>x.id===id); if(!u) return fail("사용자를 찾을 수 없습니다");
      DB.users=DB.users.filter(x=>x.id!==id);
      audit(id,"삭제",u.name,"");
      persist();
      return ok(null, "사용자가 삭제되었습니다");
    },

    /* ---------- 분류체계·코드 관리 (관리자 전용) ---------- */
    addType(name){
      if(!isAdmin()) return fail("분류체계 관리는 관리자만 가능합니다");
      if(!name) return fail("대분류명을 입력해 주세요");
      if(DB.codes.types[name]) return fail("이미 존재하는 대분류입니다");
      DB.codes.types[name]=[]; audit("codes","분류체계","",`대분류 추가: ${name}`); persist();
      return ok(null, "대분류가 추가되었습니다");
    },
    removeType(name){
      if(!isAdmin()) return fail("분류체계 관리는 관리자만 가능합니다");
      if(Object.keys(DB.codes.types).length<=1) return fail("최소 1개의 대분류가 필요합니다");
      delete DB.codes.types[name]; audit("codes","분류체계",name,"대분류 삭제"); persist();
      return ok(null, "대분류가 삭제되었습니다");
    },
    addSubtype(major,name){
      if(!isAdmin()) return fail("분류체계 관리는 관리자만 가능합니다");
      if(!name) return fail("세부유형명을 입력해 주세요");
      if(!DB.codes.types[major]) return fail("대분류를 찾을 수 없습니다");
      if(DB.codes.types[major].includes(name)) return fail("이미 존재하는 세부유형입니다");
      DB.codes.types[major].push(name); audit("codes","분류체계","",`${major} 세부유형 추가: ${name}`); persist();
      return ok(null, "세부유형이 추가되었습니다");
    },
    removeSubtype(major,name){
      if(!isAdmin()) return fail("분류체계 관리는 관리자만 가능합니다");
      if(!DB.codes.types[major]) return fail("대분류를 찾을 수 없습니다");
      DB.codes.types[major]=DB.codes.types[major].filter(s=>s!==name);
      audit("codes","분류체계",`${major}/${name}`,"세부유형 삭제"); persist();
      return ok(null, "세부유형이 삭제되었습니다");
    },
    addChannel(name){
      if(!isAdmin()) return fail("접수경로 관리는 관리자만 가능합니다");
      if(!name) return fail("접수경로명을 입력해 주세요");
      if(DB.codes.channels.includes(name)) return fail("이미 존재하는 접수경로입니다");
      DB.codes.channels.push(name); audit("codes","접수경로","",`추가: ${name}`); persist();
      return ok(null, "접수경로가 추가되었습니다");
    },
    removeChannel(name){
      if(!isAdmin()) return fail("접수경로 관리는 관리자만 가능합니다");
      if(DB.codes.channels.length<=1) return fail("최소 1개의 접수경로가 필요합니다");
      DB.codes.channels=DB.codes.channels.filter(c=>c!==name);
      audit("codes","접수경로",name,"삭제"); persist();
      return ok(null, "접수경로가 삭제되었습니다");
    },

    /* ---------- 데이터 관리(백업·복원·초기화·내보내기) ---------- */
    resetData(){
      if(!isAdmin()) return fail("데이터 초기화는 관리자만 가능합니다");
      DB=buildSeed(); persist();
      return ok(null, "샘플 데이터로 초기화되었습니다");
    },
    buildComplaintsCSV(list){
      const headers=["접수번호","접수일","접수경로","회원사","제목","유형","세부유형","중요도","담당부서","담당자","상태","처리기한","완료일"];
      const rows=list.map(c=>[c.no,c.receivedAt,c.channel,companyName(c.companyId),c.title,c.type,c.subtype,c.importance,c.dept,c.assignee,c.status,c.deadline,c.completedAt||""]);
      return "﻿"+[headers, ...rows].map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
    },
    buildBackupJSON(){
      if(!isAdmin()) return fail("백업 내보내기는 관리자만 가능합니다");
      return ok(JSON.stringify(DB, null, 2), "백업 파일을 생성했습니다");
    },
    restoreFromBackup(text){
      if(!isAdmin()) return fail("백업 복원은 관리자만 가능합니다");
      let parsed;
      try{ parsed=JSON.parse(text); }catch(e){ return fail("백업 파일 형식이 올바르지 않습니다(JSON 파싱 실패)"); }
      const required=["companies","agencies","users","complaints","policies","consultations","history","auditLog"];
      const missing=required.filter(k=>!Array.isArray(parsed[k]));
      if(missing.length) return fail("백업 파일에 필수 항목이 없습니다: "+missing.join(", "));
      if(!parsed.codes) parsed.codes={ types: JSON.parse(JSON.stringify(DEFAULT_TYPES)), channels: DEFAULT_CHANNELS.slice() };
      if(!parsed.seq) parsed.seq={};
      DB=parsed;
      if(!DB.users.some(u=>u.id===UI.currentUserId)) UI.currentUserId=DB.users[0].id;
      persist();
      return ok(null, "백업 데이터를 복원했습니다");
    },

    /* ---------- 전체 감사로그 조회 ---------- */
    globalAuditLog(filters){
      filters=filters||{};
      let list=DB.auditLog.slice();
      if(filters.entity) list=list.filter(a=>(a.entity||entityOf(a.target))===filters.entity);
      if(filters.q){
        const q=filters.q.toLowerCase();
        list=list.filter(a=> [a.user,a.field,a.before,a.after,a.reason,targetLabel(a.target)].join(" ").toLowerCase().includes(q));
      }
      return list.sort((a,b)=> a.at<b.at?1:-1);
    },
  };
})();
function resetSeed(){
  if(!confirm("모든 데이터를 초기 샘플 상태로 되돌립니다. 계속할까요?")) return;
  const r=Backend.resetData();
  if(!r.ok){ toast(r.message); return; }
  UI.view="dashboard"; toast(r.message); render();
}

/* ===================== 파생 로직 ===================== */
function ddayInfo(c){
  if(c.status==="종결" || c.status==="처리완료") return {label:"-", cls:"gray"};
  if(!c.deadline) return {label:"-", cls:"gray"};
  const d=diffDays(todayISO(), c.deadline);
  if(d<0) return {label:"D+"+(-d), cls:"danger", state:"초과"};
  if(d===0) return {label:"D-Day", cls:"warn", state:"임박"};
  if(d<=3) return {label:"D-"+d, cls:"warn", state:"임박"};
  return {label:"D-"+d, cls:"ok", state:"정상"};
}

function isDueSoon(c){ return ddayInfo(c).state==="임박"; }

function agencyName(id){ const a=DB.agencies.find(x=>x.id===id); return a?a.name:"-"; }

function isReadOnlyRole(){ return currentUser().role==="임원/조회자"; }
function isAdmin(){ return currentUser().role==="관리자"; }
function canEditComplaint(c){
  const u=currentUser();
  if(u.role==="관리자") return true;
  if(u.role==="임원/조회자") return false;
  if(u.role==="팀장") return c.dept===u.dept;
  return !c.assignee || c.assignee===u.name;
}

function computeNotifications(){
  const list=[];
  DB.complaints.forEach(c=>{
    const dd=ddayInfo(c);
    if(dd.state==="초과") list.push({type:"기한초과", complaintId:c.id, text:`[${c.no}] ${c.title} — 처리기한 초과(${dd.label})`, at:c.deadline});
    else if(dd.state==="임박") list.push({type:"기한임박", complaintId:c.id, text:`[${c.no}] ${c.title} — 처리기한 임박(${dd.label})`, at:c.deadline});
    if(c.status==="답변대기") list.push({type:"답변대기", complaintId:c.id, text:`[${c.no}] ${c.title} — 관계기관 답변 대기 중`, at:c.receivedAt});
    if(c.status==="회원사 회신대기") list.push({type:"회신필요", complaintId:c.id, text:`[${c.no}] ${c.title} — 회원사 회신 필요`, at:c.receivedAt});
    if(!c.assignee) list.push({type:"미배정", complaintId:c.id, text:`[${c.no}] ${c.title} — 담당자 미배정`, at:c.receivedAt});
  });
  DB.consultations.forEach(cs=>{
    if(cs.followup && !cs.answer){
      const c=complaintById(cs.complaintId);
      if(c) list.push({type:"후속조치", complaintId:c.id, text:`[${c.no}] ${agencyName(cs.agencyId)} 회신기한 ${cs.replyDeadline} — ${cs.followup}`, at:cs.replyDeadline});
    }
  });
  list.sort((a,b)=> (a.at<b.at?-1:1));
  return list;
}

function kpiCard(label,val){ return `<div class="kpi"><div class="lbl">${esc(label)}</div><div class="val">${val}</div></div>`; }

function lineChart(labels, values){
  const w=520,h=150,pad=28;
  const max=Math.max(1,...values);
  const stepX=(w-pad*2)/Math.max(1,values.length-1);
  const pts=values.map((v,i)=>{
    const x=pad+i*stepX;
    const y=h-pad-( (v/max) * (h-pad*2) );
    return [x,y];
  });
  const path=pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#3b6fe0"/>`).join("");
  const labelsSvg = labels.map((l,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${h-6}" font-size="10" fill="#8a8375" text-anchor="middle">${esc(l)}</text>`).join("");
  return `<svg class="linechart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e7e0d0" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="#3b6fe0" stroke-width="2.5"/>
    ${dots}${labelsSvg}
  </svg>`;
}
const DONUT_COLORS=["#3b6fe0","#b23b3b","#b87a2e","#2f8f5b","#8a63d2","#c9a227","#5aa9c9","#a3a39c"];
function donutChart(counts){
  const entries=Object.entries(counts).filter(([,v])=>v>0);
  const total=entries.reduce((s,[,v])=>s+v,0) || 1;
  let acc=0;
  const stops=entries.map(([k,v],i)=>{
    const start=acc/total*360; acc+=v; const end=acc/total*360;
    return `${DONUT_COLORS[i%DONUT_COLORS.length]} ${start}deg ${end}deg`;
  }).join(", ");
  const legend=entries.map(([k,v],i)=>`<li><span class="sw" style="background:${DONUT_COLORS[i%DONUT_COLORS.length]}"></span>${esc(k)} ${v}건</li>`).join("");
  return `<div class="donutwrap">
    <div class="donut" style="background:conic-gradient(${stops || '#e7e0d0 0deg 360deg'})"></div>
    <ul class="legend">${legend || '<li class="muted">데이터 없음</li>'}</ul>
  </div>`;
}

function statusBadge(status){

}

        </div>`:""}
      ${s===5?`

      </div>

function similarBox(similar){
  return `<h2 style="font-size:13px">유사 민원 검색</h2>
    ${similar.length? similar.map(c=>`<div class="noteitem" onclick="window.open('','_self')" style="cursor:default">
        <div class="nt">${esc(c.no)} · ${esc(companyName(c.companyId))}</div>
        <div class="nd">${esc(c.title)} · ${statusBadge(c.status)}</div>
      </div>`).join("") : '<div class="empty">제목/내용을 입력하면 과거 유사 민원을 찾아드립니다.</div>'}`;
}
function findSimilarComplaints(text){
  const tokens = text.toLowerCase().replace(/[^가-힣a-z0-9\s]/g," ").split(/\s+/).filter(t=>t.length>=2);
  if(!tokens.length) return [];
  const scored = DB.complaints.map(c=>{
    const hay=(c.title+" "+c.content).toLowerCase();
    let score=0; tokens.forEach(t=>{ if(hay.includes(t)) score++; });
    return {c, score};
  }).filter(x=>x.score>=2).sort((a,b)=>b.score-a.score);
  return scored.slice(0,4).map(x=>x.c);
}
function refreshWizardSimilar(){
  const d=UI.wizard.data;
  const similar = findSimilarComplaints(d.title+" "+d.content);
  const box=document.getElementById("w-similar-box");
  if(box) box.innerHTML = similarBox(similar);
}
function onWizardTypeChange(val){
  UI.wizard.data.type=val; UI.wizard.data.subtype=(DB.codes.types[val]||[])[0]||"";

}
function onWizardFilesPicked(files){
  UI.wizard.data.attachments = (UI.wizard.data.attachments||[]).concat(Array.from(files).map(f=>f.name));

}
function refreshWizardFiles(){
  const d=UI.wizard.data;
  document.getElementById("w-file-list").innerHTML = (d.attachments||[]).map((f,i)=>`<div class="filechip"><span>📎 ${esc(f)}</span><span class="link" onclick="UI.wizard.data.attachments.splice(${i},1); refreshWizardFiles()">삭제</span></div>`).join("") || '<div class="empty">첨부된 파일이 없습니다.</div>';
}
function readWizardStepInputs(step){
  const d=UI.wizard.data;
  if(step===1){ d.receivedAt=val("w-receivedAt")||d.receivedAt; d.channel=val("w-channel")||d.channel; d.companyId=val("w-companyId"); d.companyManager=val("w-companyManager"); }
  if(step===2){ d.title=val("w-title"); d.content=val("w-content"); d.type=val("w-type")||d.type; d.subtype=val("w-subtype"); d.importance=val("w-importance")||d.importance; d.relatedLaw=val("w-relatedLaw"); }
  if(step===3){ d.dept=val("w-dept")||d.dept; d.assignee=val("w-assignee"); d.deadline=val("w-deadline")||d.deadline; }
}
function val(id){ const el=document.getElementById(id); return el? el.value : ""; }
function wizardGo(next){
  readWizardStepInputs(UI.wizard.step);

function submitWizard(){

}

}

function importanceLikeBadge(p){
  const cnt=p.linkedComplaintIds.length;
  const level = cnt>=5? "높음" : cnt>=3? "보통" : "낮음";
  return importanceBadge(level);
}
function buildIssueTimeline(p, linked){
  const items=[];
  if(linked.length){ const first=[...linked].sort((a,b)=>a.receivedAt<b.receivedAt?-1:1)[0]; items.push({date:first.receivedAt, label:"민원 접수", done:true}); }
  items.push({date:p.proposedAt, label:"공통 이슈 지정 · 정책건의 발굴", done:true});
  const consult = DB.consultations.filter(cs=> linked.some(c=>c.id===cs.complaintId)).sort((a,b)=>a.date<b.date?-1:1);
  consult.slice(0,2).forEach(cs=> items.push({date:cs.date, label:`${agencyName(cs.agencyId)} 협의`, done:true}));
  items.push({date:p.proposedAt, label:"기관 제출", done: !["발굴","내부검토"].includes(p.status)});
  items.push({date: p.status==="답변완료"||p.status==="반영"||p.status==="일부반영"||p.status==="미반영" ? p.proposedAt : "-", label: ["반영","일부반영","미반영","답변완료","종결"].includes(p.status) ? "기관 답변" : "답변 예정", done: ["반영","일부반영","미반영","답변완료","종결"].includes(p.status)});
  return items;
}

function viewStats(){
  UI.statsRange = UI.statsRange || "분기";
  const total=DB.complaints.length;
  const done=DB.complaints.filter(c=>["처리완료","종결"].includes(c.status)).length;
  const rate = total? Math.round(done/total*1000)/10 : 0;
  const durations = DB.complaints.filter(c=>c.completedAt).map(c=>diffDays(c.receivedAt,c.completedAt));
  const avgDays = durations.length? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length*10)/10 : 0;
  const policyDone=DB.policies.filter(p=>["반영","일부반영"].includes(p.status)).length;
  const policyRate = DB.policies.length? Math.round(policyDone/DB.policies.length*1000)/10 : 0;

  const months=[]; for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
  const monthCounts=months.map(m=>DB.complaints.filter(c=>monthLabel(c.receivedAt)===m).length);
  const monthPrev=months.map((m,i)=> i===0?0:monthCounts[i-1]);

  const typeCounts={}; DB.complaints.forEach(c=>{ typeCounts[c.type]=(typeCounts[c.type]||0)+1; });
  const maxType=Math.max(1,...Object.values(typeCounts));

  const flow = {
    "정책건의": DB.policies.length,
    "기관 검토": DB.policies.filter(p=>["기관 제출","기관 검토"].includes(p.status)).length,
    "전면 반영": DB.policies.filter(p=>p.status==="반영").length,
    "일부 반영": DB.policies.filter(p=>p.status==="일부반영").length,
    "지속추진": DB.policies.filter(p=>p.status==="지속추진").length,
    "미반영": DB.policies.filter(p=>p.status==="미반영").length,
  };

  return `
  <div class="card">
    <div class="toprow" style="justify-content:space-between;display:flex;align-items:center">
      <div class="btnrow">
        ${["월간","분기","연간"].map(r=>`<button class="btn sm ${UI.statsRange===r?'primary':'ghost'}" onclick="UI.statsRange='${r}'; render()">${r}</button>`).join("")}
      </div>
    </div>
    <div class="grid cols-4" style="margin-top:12px">
      ${kpiCard("총 접수", total+"건")}
      ${kpiCard("처리율", rate+"%")}
      ${kpiCard("평균 처리기간", avgDays+"일")}
      ${kpiCard("정책반영률", policyRate+"%")}
    </div>
  </div>
  <div class="grid cols-2">
    <div class="card">
      <h2>민원 추이 (월별)</h2>
      ${lineChart(months.map(m=>m.slice(5)+"월"), monthCounts)}
    </div>
    <div class="card">
      <h2>유형별 현황</h2>
      <div class="barlist">
        ${Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).map(([t,v])=>`
          <div class="brow"><div class="blab"><span>${esc(t)}</span><span>${v}건</span></div>
            <div class="btrack"><div class="bfill" style="width:${(v/maxType*100).toFixed(0)}%"></div></div>
          </div>`).join("") || `<div class="empty">데이터 없음</div>`}
      </div>
    </div>
  </div>
  <div class="card">
    <h2>정책성과 흐름</h2>
    <div class="toprow">
      ${Object.entries(flow).map(([k,v])=>`<span class="pill" style="${k.includes('반영')&&!k.includes('미')?'background:var(--ok-soft);color:var(--ok)':k==='미반영'?'background:var(--danger-soft);color:var(--danger)':''}">${esc(k)} ${v}</span>`).join(" → ")}
    </div>
  </div>
  <div class="card">
    <div class="btnrow">
      <button class="btn ghost" onclick="exportCSV(DB.complaints)">⬇ Excel(CSV)</button>
      <button class="btn ghost" onclick="window.print()">🖨 PDF 보고서(인쇄)</button>
    </div>
  </div>`;
}

}
function doAddType(){ const r=Backend.addType(val("ty-name")); if(!r.ok){ toast(r.message); return; } closeModal(); render(); toast(r.message); }
function doRemoveType(name){ if(!confirm(`'${name}' 대분류를 삭제할까요? (이미 등록된 민원의 기존 유형 표시는 유지됩니다)`)) return; const r=Backend.removeType(name); if(!r.ok){ toast(r.message); return; } render(); toast(r.message); }
function openAddSubtypeForm(major){
  openModal(`${major} — 세부유형 추가`, `<div class="field"><label class="req">세부유형명</label><input type="text" id="sty-name"></div>
    <div class="btnrow"><button class="btn primary" onclick="doAddSubtype('${major.replace(/'/g,"\\'")}')">추가</button><button class="btn ghost" onclick="closeModal()">취소</button></div>`);
}
function doAddSubtype(major){ const r=Backend.addSubtype(major, val("sty-name")); if(!r.ok){ toast(r.message); return; } closeModal(); render(); toast(r.message); }
function doRemoveSubtype(major,name){ const r=Backend.removeSubtype(major,name); if(!r.ok){ toast(r.message); return; } render(); toast(r.message); }
function openAddChannelForm(){
  openModal("접수경로 추가", `<div class="field"><label class="req">접수경로명</label><input type="text" id="ch-name"></div>
    <div class="btnrow"><button class="btn primary" onclick="doAddChannel()">추가</button><button class="btn ghost" onclick="closeModal()">취소</button></div>`);
}
function doAddChannel(){ const r=Backend.addChannel(val("ch-name")); if(!r.ok){ toast(r.message); return; } closeModal(); render(); toast(r.message); }
function doRemoveChannel(name){ const r=Backend.removeChannel(name); if(!r.ok){ toast(r.message); return; } render(); toast(r.message); }

function adminPermissions(){
  const roles=[
    {role:"일반사용자", view:"○", create:"○", edit:"본인 담당 건(또는 미배정)", del:"X", admin:"X"},
    {role:"담당자", view:"○", create:"○", edit:"본인 담당 건(또는 미배정)", del:"X", admin:"X"},
    {role:"팀장", view:"○", create:"○", edit:"소속 부서 전체 건", del:"제한(종결 처리로 대체)", admin:"X"},
    {role:"관리자", view:"○", create:"○", edit:"전체 건", del:"○(사용자·코드 등 시스템 데이터)", admin:"○"},
    {role:"임원/조회자", view:"○", create:"X", edit:"X", del:"X", admin:"X"},
  ];
  const counts={}; DB.users.forEach(u=> counts[u.role]=(counts[u.role]||0)+1);
  return `
  <h2>권한 매트릭스</h2>
  <div class="hint" style="margin-bottom:10px">PRD §21 권한 규칙이 실제 화면에 적용된 내용입니다. 사용자별 권한 변경은 "사용자" 탭에서 합니다.</div>
  <table><thead><tr><th>권한</th><th>조회</th><th>등록</th><th>수정 범위</th><th>삭제</th><th>시스템 관리</th><th class="num">현재 인원</th></tr></thead><tbody>
    ${roles.map(r=>`<tr style="cursor:default"><td><b>${esc(r.role)}</b></td><td>${r.view}</td><td>${r.create}</td><td>${esc(r.edit)}</td><td>${esc(r.del)}</td><td>${r.admin}</td><td class="num">${counts[r.role]||0}명</td></tr>`).join("")}
  </tbody></table>
  <div class="hint" style="margin-top:12px">실제 로그인 사용자를 바꿔가며 확인하려면 화면 우측 상단의 사용자 선택 드롭다운을 사용하세요.</div>`;
}

function adminAudit(){
  const f=UI.auditFilters=UI.auditFilters||{};
  const entities=["민원","회원사","관계기관","정책건의","사용자","분류체계","기타"];
  const list=Backend.globalAuditLog(f).slice(0,300);
  return `
  <div class="toprow" style="justify-content:space-between;display:flex;align-items:center"><h2 style="margin:0">전체 감사로그</h2><span class="muted" style="font-size:12.5px">총 ${DB.auditLog.length}건 중 최근 ${list.length}건 표시</span></div>
  <div class="searchbar">
    <input type="search" placeholder="사용자 / 항목 / 대상 검색" value="${esc(f.q||'')}" oninput="UI.auditFilters.q=this.value; render()">
  </div>
  <div class="filters">
    <select onchange="UI.auditFilters.entity=this.value; render()"><option value="">대상유형 전체</option>${entities.map(e=>`<option value="${e}" ${f.entity===e?'selected':''}>${e}</option>`).join("")}</select>
    ${(f.q||f.entity)?`<button class="btn ghost sm" onclick="UI.auditFilters={}; render()">필터 초기화</button>`:""}
  </div>
  <table><thead><tr><th>일시</th><th>사용자</th><th>대상유형</th><th>대상</th><th>항목</th><th>변경전</th><th>변경후</th><th>사유</th></tr></thead><tbody>
  ${list.length? list.map(a=>`<tr style="cursor:${a.target&&a.target.startsWith('cp_')?'pointer':'default'}" onclick="${a.target&&a.target.startsWith('cp_')?`setView('complaint-detail',{id:'${a.target}'})`:''}">
      <td>${esc(a.at)}</td><td>${esc(a.user)}</td><td>${esc(a.entity||Backend.entityOf(a.target))}</td><td>${esc(Backend.targetLabel(a.target))}</td>
      <td>${esc(a.field)}</td><td>${esc(a.before)}</td><td>${esc(a.after)}</td><td>${esc(a.reason)}</td>
    </tr>`).join("") : `<tr style="cursor:default"><td colspan="8" class="empty">기록이 없습니다.</td></tr>`}
  </tbody></table>`;
}

function adminData(){
  return `
  <h2>데이터 관리</h2>
  <div class="grid cols-3">
    ${kpiCard("민원", DB.complaints.length+"건")}
    ${kpiCard("회원사·기관", DB.companies.length+DB.agencies.length+"개")}
    ${kpiCard("감사로그", DB.auditLog.length+"건")}
  </div>
  <div class="kv"><div class="k">정책건의</div><div>${DB.policies.length}건</div></div>
  <div class="kv"><div class="k">처리이력</div><div>${DB.history.length}건</div></div>
  <div class="kv"><div class="k">사용자</div><div>${DB.users.length}명</div></div>
  <h2 style="margin-top:20px">내보내기</h2>
  <div class="btnrow">
    <button class="btn ghost" onclick="exportCSV(DB.complaints)">⬇ 민원 CSV 내보내기</button>
    ${isAdmin()? `<button class="btn ghost" onclick="doExportBackup()">⬇ 전체 백업(JSON) 내보내기</button>` : ""}
  </div>
  ${isAdmin()? `
  <h2 style="margin-top:20px">복원 / 초기화</h2>
  <div class="field" style="max-width:420px"><label>백업 파일(JSON)로 복원</label><input type="file" accept="application/json" onchange="handleImportFile(this.files)"></div>
  <div class="btnrow" style="margin-top:8px">
    <button class="btn danger" onclick="resetSeed()">샘플 데이터로 초기화</button>
  </div>
  ` : `<div class="hint" style="margin-top:16px">백업 내보내기·복원·초기화는 관리자 권한이 필요합니다.</div>`}
  <div class="hint" style="margin-top:16px">모든 데이터는 이 브라우저의 로컬 저장소(localStorage)에만 저장됩니다. 다른 PC·브라우저와 공유하려면 백업(JSON)을 내보내 상대방이 복원하면 됩니다.</div>`;
}
function doExportBackup(){
  const r=Backend.buildBackupJSON();
  if(!r.ok){ toast(r.message); return; }
  downloadTextFile(r.data, `edpa_backup_${todayISO()}.json`, "application/json;charset=utf-8;");
  toast(r.message);
}
function handleImportFile(files){
  const file=files && files[0]; if(!file) return;
  if(!confirm("백업 파일로 복원하면 현재 브라우저의 데이터가 모두 대체됩니다. 계속할까요?")) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const r=Backend.restoreFromBackup(String(e.target.result));
    if(!r.ok){ toast(r.message); return; }
    UI.view="dashboard"; toast(r.message); render();
  };
  reader.onerror=function(){ toast("파일을 읽는 중 오류가 발생했습니다"); };
  reader.readAsText(file, "utf-8");
}

/* ===================== 알림 패널 ===================== */
function toggleNotifPanel(){
  const list=computeNotifications();
  document.getElementById("notif-panel-body").innerHTML = list.length? list.map(n=>`
    <div class="noteitem" onclick="closeNotifPanel(); setView('complaint-detail',{id:'${n.complaintId}'})">
      <div class="nt">${notifIcon(n.type)} ${esc(n.type)}</div>
      <div class="nd">${esc(n.text)}</div>
    </div>`).join("") : `<div class="empty">새 알림이 없습니다.</div>`;
  document.getElementById("notif-panel-backdrop").classList.add("show");
}
function notifIcon(type){
  return {"기한초과":"🔴","기한임박":"🟠","답변대기":"🔵","회신필요":"🟣","미배정":"⚪","후속조치":"🟡"}[type] || "🔔";
}
function closeNotifPanel(){ document.getElementById("notif-panel-backdrop").classList.remove("show"); }

/* ===================== 모달 공통 ===================== */
function openModal(title, bodyHtml){
  document.getElementById("modal-box").classList.remove("wide");
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-body").innerHTML=bodyHtml;
  document.getElementById("modal-backdrop").classList.add("show");
}
function openModalWide(title, bodyHtml){
  document.getElementById("modal-box").classList.add("wide");
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-body").innerHTML=bodyHtml;
  document.getElementById("modal-backdrop").classList.add("show");
}
function closeModal(){ document.getElementById("modal-backdrop").classList.remove("show"); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeModal(); closeNotifPanel(); } });

/* ===================== 초기화 ===================== */
function init(){
  DB = loadDB();
  DB.attachments = DB.attachments || [];
  UI = { view:"dashboard", params:{}, currentUserId: DB.users[0].id, filters:{}, detailTab:"info" };
  persist();
  render();
}
init();
</script>
</body>
</html>
